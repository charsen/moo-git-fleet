function topbar(active){return `<header class="topbar"><img class="logo" src="../../public/logo_2.svg" alt="Moo Fleet"><nav class="top-tabs" aria-label="工作区"><button data-screen="overview" class="${active==='overview'?'active':''}">${icon('folder')}仓库舰队</button><button data-screen="sessions" class="${active==='sessions'?'active':''}">${icon('chat')}AI 会话</button></nav><div class="top-actions"><span class="api-ready"><i class="dot"></i>LOCAL / READY</span>${button(active==='sessions'?'同步会话':'刷新状态',active==='sessions'?'cloud':'refresh')}${button('', 'settings','icon')}<button class="avatar" data-screen="settings" aria-label="打开个人配置">MF</button></div></header>`}
function metrics(session=false){const labels=session?['这台电脑','等待备份','另一台电脑','需要决定']:['仓库总数','今日待处理','工作区改动','待推送提交','待拉取提交'];const values=session?[24,3,18,0]:[6,4,2,3,1];return `<div class="metrics" style="grid-template-columns:repeat(${labels.length},1fr)">${labels.map((label,i)=>`<button class="metric ${i===1||i===2?'attention':''} ${i>2?'remote':''}" data-metric="${i}" aria-pressed="${i===0}">${icon(i===0?'folder':i===1?'history':i===2?'file':i===3?'up':'down')}<div><strong>${String(values[i]).padStart(2,'0')}</strong><small>${label}</small></div></button>`).join('')}</div>`}
function overview(){return `${topbar('overview')}<section class="page"><div class="page-heading"><div><h1>仓库工作台</h1><p>每个仓库的变化，一目了然</p></div><span class="small-tag">扫描 8 秒前 · 240 ms</span></div>${metrics()}<section class="repo-panel"><div class="filters">${search('搜索仓库、分组或路径','repo-search')}${button('有动静优先 '+icon('chevron'))}${button('全部分组 '+icon('chevron'))}${button('全部状态 '+icon('chevron'))}</div><div class="batch"><small>当前范围 · <span id="repo-count">6</span> 个仓库</small>${button('Fetch','refresh')}${button('安全 Pull 1','down')}${button('安全 Push 3','up')}</div><table class="repo-table"><thead><tr><th><input type="checkbox" aria-label="全选示例仓库" id="all-repos"></th><th>仓库</th><th>分支 / UPSTREAM</th><th>工作区</th><th>远端</th><th>最近提交</th><th>状态</th></tr></thead><tbody id="repo-rows">${repoRows(repos)}</tbody></table><footer class="panel-footer"><span>6 个仓库 · 状态按最近一次扫描展示</span><span>↑ ↓ 浏览　↵ 打开仓库</span></footer></section></section>`}
function repoRows(items){return items.map(r=>`<tr data-repo="${r[0]}"><td><input type="checkbox" aria-label="选择 ${r[0]}"></td><td><button class="repo-name" data-repo="${r[0]}">${r[0]}</button><small>${r[1]} · ~/Projects/${r[0]}</small></td><td><span class="mono blue" title="${r[2]}" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r[2]}</span><small class="mono">origin/${r[2]}</small></td><td>${r[3]?`<span class="mono yellow">M ${r[3]}</span>`:'<span class="muted">—</span>'}</td><td><span class="mono ${r[4]||r[5]?'blue':'muted'}">↑ ${r[4]}　↓ ${r[5]}</span><small>Fetch 8 分钟前</small></td><td><div class="commit-title">${r[6]}</div><small>demo · ${r[7]}</small></td><td><span class="status ${r[3]?'yellow':r[4]||r[5]?'blue':'green'}">${icon(r[3]?'file':r[4]?'up':r[5]?'down':'check')}${r[3]?'有改动':r[4]?'待推送':r[5]?'待拉取':'已同步'}</span></td></tr>`).join('')}
function sidebar(history){return `<aside class="sidebar"><p class="section-label">仓库</p><nav class="nav-group" aria-label="仓库视图">${[['workspace','file','工作区','6'],['history','history','提交历史',''],['stash','stash','Stash 备份','2'],['tags','tag','标签',''],['compare','compare','分支对比',''],['reflog','history','Reflog','']].map(([id,name,label,count])=>`<button class="nav-item ${(history?id==='history':id==='workspace')?'active':''}" ${['workspace','history'].includes(id)?`data-screen="${id}"`:'data-demo'}>${icon(name)}${label}<span class="count">${count}</span></button>`).join('')}</nav><p class="section-label">本地分支 <span>3</span></p><div class="branch current">${icon('branch')}feat-moon-depth <span class="small-tag">HEAD</span></div><div class="branch">${icon('branch')}main</div><div class="branch">${icon('branch')}dev</div><p class="section-label" style="margin-top:27px">远端分支 <span>3</span></p><div class="remote-title">${icon('chevron')}origin</div><div class="branch remote-branch">${icon('branch')}main</div><div class="branch remote-branch">${icon('branch')}dev</div><div class="branch remote-branch">${icon('branch')}feat-moon-depth</div><p class="sidebar-note">单击浏览分支历史<br>双击切换本地分支</p></aside>`}
function fileRows(){return files.map(([name,path,status],i)=>`<div class="file-row ${i===fileIndex?'active':''}" data-file-row="${i}"><input type="checkbox" aria-label="纳入提交 ${name}" data-check><span class="file-status ${status==='A'?'green':''}">${status}</span><button data-file="${i}" aria-pressed="${i===fileIndex}"><strong>${name}</strong><small>${path||'仓库根目录'}</small></button></div>`).join('')}
function workspace(history=false){return `<header class="repo-header"><button class="btn quiet" data-screen="overview">${icon('back')}返回</button><span class="project-mark">${icon('folder')}</span><h1>${escape(repoName)}</h1><button class="btn icon quiet" data-demo aria-label="切换项目">${icon('chevron')}</button><span class="branch-label">${icon('branch')}feat-moon-depth</span><div class="header-tools">${button('Fetch','refresh')}${button('安全 Pull 0','down')}${button('安全 Push 2','up')}${button('','refresh','icon quiet')}</div></header><section class="three-panes">${sidebar(history)}<section class="middle"><header class="pane-heading"><div><h2>${history?'提交历史':'工作区'}</h2><span class="small-tag">${history?'全仓':'6 个文件'}</span></div><p>${history?'所有本地分支、远端分支与标签':'feat-moon-depth'}</p>${search(history?'搜索提交记录':'搜索变化文件','file-search')}</header><div class="list-caption"><span>${history?'最近提交':'变化文件'}</span><span>${history?'20 条记录':'未暂存'}</span></div><div class="file-list">${history?commits.map(([title,sha,time],i)=>`<button class="history-row ${i===commitIndex?'active':''}" data-commit="${i}" aria-pressed="${i===commitIndex}"><strong>${title}</strong><small><span>demo</span><span>${time}</span></small><code>${sha}${i===0?' · HEAD':''}</code></button>`).join(''):fileRows()}</div>${history?'<div class="middle-foot">↑ ↓ 浏览提交 <span>已加载 20 条</span></div>':`<div class="middle-foot">↑ ↓ 浏览 · 空格勾选 <span id="checked-count">已勾选 0 / 6</span></div><section class="commit-box"><div class="commit-heading"><strong>编写提交</strong><button data-demo>生成文案</button></div><input placeholder="提交标题" aria-label="示例提交标题"><button class="btn primary" id="demo-commit" disabled data-demo>${icon('commit')}提交 <span class="count" style="color:inherit">⌘ ↵</span></button></section>`}</section><section class="reading" id="reading">${preview(history)}</section></section><footer class="workspace-foot">${button('编辑配置','settings','quiet')}${button('Finder','folder','quiet')}${button('Terminal','terminal','quiet')}${button('VS Code','file','quiet')}<span class="path">~/Projects/${escape(repoName)}</span></footer>`}
const vueLines=[' import { computed } from \'vue\';',' import { useRepository } from \'../composables/repository\';',' ',' const repository = useRepository();',' const files = computed(() => repository.files);',' ','-const activeColor = \'blue\';','+const activeColor = \'selection\';','+const focusColor = \'brand\';',' ',' function selectFile(file) {','   repository.preview(file.path);',' }',' ',' <template>','   <main class="repository-workspace">','     <BranchSidebar />','     <WorkingFiles :files="files" />','     <DiffPreview />','   </main>',' </template>'];
function highlight(code){return code.split(/('[^']*'|"[^"]*"|\b(?:const|function|import|from|return)\b)/g).map(s=>/^['"]/.test(s)?`<span class="str">${escape(s)}</span>`:/^(const|function|import|from|return)$/.test(s)?`<span class="kw">${escape(s)}</span>`:escape(s)).join('')}
function diffLines(lines){let old=18,next=18;return lines.map(line=>{const sign=line[0],kind=sign==='+'?'add':sign==='-'?'remove':'';const o=kind==='add'?'':old++,n=kind==='remove'?'':next++;return `<div class="code-row ${kind}"><span class="gutter">${o}</span><span class="gutter">${n}</span><span class="sign">${kind?sign:''}</span><span class="code-text">${highlight(line.slice(1))}</span></div>`}).join('')}
function preview(history){const [name,path]=files[fileIndex];const lines=name.endsWith('.css')?[' .repository-workspace {','-  background: var(--color-surface);','+  background: var(--color-canvas);',' }',' ',' .workspace-sidebar {','+  background: var(--color-navigation);',' }',' ',' .workspace-files {','+  background: var(--color-list);',' }',' ',' .workspace-preview {','+  background: var(--color-reading);',' }']:name.endsWith('.md')?[' # Moo Fleet',' ','-Open the repository drawer.','+Open the repository workspace.','+Select a file to review changes.']:name.endsWith('.ts')?[' export const surfaces = {','+  navigation: \'#171c20\',','+  list: \'#272e34\',','+  reading: \'#1c2227\',',' };']:vueLines;return `<header class="reading-header"><div class="reading-breadcrumb">${icon(history?'history':'folder')}${history?'提交详情':path||'仓库根目录'}</div><h2>${icon(history?'commit':'file')}${history?commits[commitIndex][0]:name}</h2><div class="reading-meta"><span>${history?commits[commitIndex][1]+' · demo · '+commits[commitIndex][2]:'工作区变化'}</span><span class="delta"><span class="green">+ ${history?24:3}</span>　<span class="red">− ${history?8:1}</span></span></div></header>${history?'<section class="history-summary">统一导航、列表与阅读区的背景层次。<p>文件和提交列表沿用相同的选中标记，保留 Git 增删颜色。</p></section>':''}<div class="reading-toolbar">${history?`<span class="mono" style="font-size:11px">${icon('file')} RepositoryWorkspace.vue</span>`:'<div class="segmented"><button class="active" data-scope="unstaged" aria-pressed="true">未暂存</button><button data-scope="staged" aria-pressed="false">已暂存</button></div>'}<span class="muted" style="font:10px var(--mono)">${history?'1 / 4 个变化文件':name.endsWith('.vue')?'Vue':name.endsWith('.css')?'CSS':'文本'}</span></div><div class="reading-scroll"><div class="diff"><div class="hunk">@@ −18,13 +18,15 @@　${history?'统一工作台层次':'工作区变化'}</div>${diffLines(history?vueLines:lines)}</div></div><footer class="reading-foot"><span>UTF-8 · LF</span><span>${history?'提交只读预览':'未暂存 · 只读预览'}</span></footer>`}
function sessions(){return `${topbar('sessions')}<section class="page"><div class="page-heading"><div><h1>AI 会话</h1><p>保留工作上下文，在不同电脑间继续</p></div><span class="small-tag">上次同步 · 8 分钟前</span></div>${metrics(true)}<section class="repo-panel"><div class="filters">${search('搜索会话标题或项目','session-search')}${button('全部项目 '+icon('chevron'))}${button('全部来源 '+icon('chevron'))}${button('最新优先 '+icon('chevron'))}</div><div class="session-labels">本机会话 <span style="float:right">显示 4 / 24</span></div>${[['仓库工作台的视觉层次','moo-git-fleet','Codex','等待备份','12 分钟前'],['整理组件样式与交互细节','studio-kit','Claude','已备份','1 小时前'],['完善搜索接口的分页返回','orbit-api','Codex','已备份','2 小时前'],['补充安装与使用说明','lumen-docs','Claude','已备份','昨天']].map(([title,project,provider,status,time],i)=>`<div class="session-list-row ${i===0?'selected':''}" data-session-row><input type="checkbox" aria-label="选择示例会话 ${title}"><button data-session><div class="session-title">${title}</div><div class="session-summary">${project} · 最近 200 条可读消息</div></button><span><span class="provider">${provider}</span></span><span class="status ${status==='等待备份'?'yellow':'green'}">${icon(status==='等待备份'?'history':'check')}${status}</span><small>${time}</small></div>`).join('')}<footer class="panel-footer"><span>本机会话是备份的内容来源</span><span>↑ ↓ 浏览会话　↵ 查看详情</span></footer></section></section>`}
function settings(){return `${topbar('overview')}<section class="settings-surface"><section class="settings-window" aria-label="个人配置与仓库接入"><header class="settings-header"><h2>个人配置与仓库接入</h2><button class="btn icon quiet" data-screen="overview" aria-label="关闭设置">${icon('close')}</button></header><div class="settings-body"><nav class="settings-nav" aria-label="设置分区">${[['user','个人信息'],['palette','界面显示'],['chat','AI 服务'],['folder','仓库接入']].map(([name,label])=>`<button class="nav-item ${label==='界面显示'?'active':''}" data-setting="${label}">${icon(name)}${label}</button>`).join('')}</nav><section class="settings-content"><h2>界面显示</h2><p>选择适合阅读的字体与字号</p>${[['界面字体','导航、按钮与正文','IBM Plex Sans'],['界面字号','界面元素的显示大小','14 px · 默认'],['代码字体','Diff、路径与提交编号','JetBrains Mono'],['代码字号','独立控制代码阅读密度','12 px']].map(([label,hint,value])=>`<div class="setting-row"><div><label>${label}</label><small>${hint}</small></div>${button(value+' '+icon('chevron'))}</div>`).join('')}</section></div><footer class="settings-footer"><span>外观偏好保存在本机</span>${button('恢复默认','','quiet')}</footer></section></section>`}
function show(next){screen=next;document.getElementById('app').innerHTML=screen==='overview'?overview():screen==='sessions'?sessions():screen==='settings'?settings():workspace(screen==='history');document.querySelectorAll('.review-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));document.getElementById('toast').hidden=true}
function notify(text){const toast=document.getElementById('toast');toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2400)}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-repo]');if(!target)return;if(e.target.matches('input'))return;if(target.dataset.screen){show(target.dataset.screen);return}if(target.dataset.repo){repoName=target.dataset.repo;show('workspace');return}if(target.dataset.file!==undefined){fileIndex=Number(target.dataset.file);document.querySelectorAll('[data-file-row]').forEach(row=>{const active=Number(row.dataset.fileRow)===fileIndex;row.classList.toggle('active',active);row.querySelector('button').setAttribute('aria-pressed',String(active))});document.getElementById('reading').innerHTML=preview(false);return}if(target.dataset.commit!==undefined){commitIndex=Number(target.dataset.commit);document.querySelectorAll('[data-commit]').forEach(row=>{const active=Number(row.dataset.commit)===commitIndex;row.classList.toggle('active',active);row.setAttribute('aria-pressed',String(active))});document.getElementById('reading').innerHTML=preview(true);return}if(target.dataset.metric!==undefined){target.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===target)));notify('设计稿：仅切换摘要选中态');return}if(target.hasAttribute('data-session')){document.querySelectorAll('[data-session-row]').forEach(row=>row.classList.toggle('selected',row.contains(target)));return}if(target.dataset.scope){target.parentElement.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b===target);b.setAttribute('aria-pressed',String(b===target))});notify('设计稿：切换差异范围的选中样式');return}if(target.dataset.setting){if(target.dataset.setting==='界面显示')return;notify('本稿展示「界面显示」分区');return}if(target.hasAttribute('data-demo'))notify('设计稿：此操作尚未接入业务')});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-check')){const count=document.querySelectorAll('[data-check]:checked').length;document.getElementById('checked-count').textContent=`已勾选 ${count} / 6`;document.getElementById('demo-commit').disabled=!count}if(e.target.id==='all-repos')document.querySelectorAll('#repo-rows input').forEach(i=>i.checked=e.target.checked)});
document.addEventListener('input',e=>{if(e.target.id==='repo-search'){const query=e.target.value.toLowerCase();const visible=repos.filter(r=>r.join(' ').toLowerCase().includes(query));document.getElementById('repo-rows').innerHTML=repoRows(visible);document.getElementById('repo-count').textContent=visible.length}if(e.target.id==='file-search'){const query=e.target.value.toLowerCase();document.querySelectorAll('[data-file-row],[data-commit]').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query))}if(e.target.id==='session-search'){const query=e.target.value.toLowerCase();document.querySelectorAll('[data-session-row]').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.target.matches('input,textarea'))show('overview');if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.querySelector('.search input')?.focus()}if(e.code==='Space'&&e.target.matches('[data-file]')){e.preventDefault();const check=e.target.closest('[data-file-row]').querySelector('[data-check]');check.checked=!check.checked;check.dispatchEvent(new Event('change',{bubbles:true}));return}if(!['ArrowDown','ArrowUp'].includes(e.key)||e.target.matches('input,textarea'))return;const selector=e.target.matches('[data-file]')?'[data-file]':e.target.matches('[data-commit]')?'[data-commit]':null;if(!selector)return;const items=[...document.querySelectorAll(selector)].filter(b=>!b.closest('[hidden]'));const index=items.indexOf(e.target);const next=items[(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length];e.preventDefault();next?.focus();next?.click()});
show(screen);
</script>
