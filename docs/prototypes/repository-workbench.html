<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brandmark" data-icon="fleet"></span><div><strong>Moo Fleet</strong><small>GIT WORKSPACE</small></div></div>
      <button class="back" id="back" title="返回仓库列表"><span data-icon="left"></span><span>仓库列表</span></button>
      <div class="project"><h1>demo-workspace <span>本地仓库</span></h1><p><span data-icon="branch"></span><code id="current-branch">feat-workbench</code><span>·</span><span id="project-changes">12 个文件变化</span></p></div>
      <div class="toolbar"><button class="tool flat" id="refresh" title="刷新工作区"><span data-icon="refresh"></span>刷新</button><span class="toolbar-separator"></span><button class="tool" data-demo="Fetch"><span data-icon="fetch"></span>Fetch</button><button class="tool" data-demo="Pull"><span data-icon="down"></span>Pull <span class="count">0</span></button><button class="tool" data-demo="Push"><span data-icon="up"></span>Push <span class="count">2</span></button><button class="tool flat" id="project-menu" title="项目操作" aria-label="项目操作"><span data-icon="more"></span></button></div>
    </header>
    <main class="workspace">
      <aside class="sidebar" aria-label="项目导航与分支">
        <div class="section-label">工作空间</div>
        <nav class="nav-list" aria-label="项目导航"><button class="nav active" data-view="working"><span data-icon="folder"></span>工作区<span class="nav-count" id="nav-changes">12</span></button><button class="nav" data-view="history"><span data-icon="history"></span>提交历史</button><button class="nav" data-view="stash"><span data-icon="stash"></span>Stash<span class="nav-count neutral">2</span></button><button class="nav" data-view="tags"><span data-icon="tag"></span>Tag<span class="nav-count neutral">3</span></button></nav>
        <div class="section-label">本地分支<button id="new-branch" title="新建分支" aria-label="新建分支"><span data-icon="plus"></span></button></div>
        <div id="branches"><button class="branch" data-branch="main"><span data-icon="branch"></span><span class="branch-name">main</span></button><button class="branch" data-branch="dev"><span data-icon="branch"></span><span class="branch-name">dev</span><span class="branch-extra">↑ 2</span></button><button class="branch current" data-branch="feat-workbench"><span data-icon="branch"></span><span class="branch-name">feat-workbench</span><span class="head">HEAD</span></button><button class="branch" data-branch="fix-empty-state"><span data-icon="branch"></span><span class="branch-name">fix-empty-state</span><span class="branch-extra" title="被其他 Worktree 占用">▣</span></button></div>
        <details open><summary><span data-icon="chevron"></span>远端分支</summary><div class="remote-name"><span data-icon="remote"></span>origin</div><button class="branch remote-branch" data-branch="origin/main"><span data-icon="branch"></span><span class="branch-name">main</span></button><button class="branch remote-branch" data-branch="origin/dev"><span data-icon="branch"></span><span class="branch-name">dev</span></button><button class="branch remote-branch" data-branch="origin/feat-workbench"><span data-icon="branch"></span><span class="branch-name">feat-workbench</span></button></details>
        <details><summary><span data-icon="chevron"></span>关联 Worktree <span class="muted">1</span></summary><div class="worktree">fix-empty-state<span>../demo-empty-state</span></div></details>
        <div class="sidebar-bottom"><button class="tool flat" id="settings"><span data-icon="settings"></span>仓库设置</button></div>
      </aside>
      <div class="splitter" id="left-splitter" role="separator" aria-label="调整分支栏宽度" aria-orientation="vertical" tabindex="0"></div>
      <section class="files-pane" aria-label="工作区文件">
        <header class="pane-heading"><h2 id="pane-title">工作区</h2><span class="small-count" id="pane-count">12</span><button class="tool flat" id="collapse-groups" title="折叠或展开文件分区" aria-label="折叠或展开文件分区"><span data-icon="layers"></span></button></header>
        <div class="files-tools"><label class="search"><span data-icon="search"></span><input id="search" placeholder="搜索文件名或路径…" aria-label="搜索文件名或路径"><kbd>⌘ K</kbd><button class="clear-search" id="clear-search" type="button" aria-label="清除文件筛选" title="清除筛选" hidden><span data-icon="close"></span></button></label></div>
        <div class="file-scroll" id="file-list"></div>
        <footer class="file-summary" id="file-summary"></footer>

    }
    function updateBranch(){$('current-branch').textContent=branch;document.querySelectorAll('[data-branch]').forEach(b=>{b.classList.toggle('current',b.dataset.branch===branch);b.querySelector('.head')?.remove();if(b.dataset.branch===branch)b.insertAdjacentHTML('beforeend','<span class="head">HEAD</span>')})}
    $('file-list').addEventListener('click',e=>{const row=e.target.closest('.file-row');if(row){if(e.target.matches('input')){const key=row.dataset.kind+'|'+row.dataset.path;e.target.checked?checked.add(key):checked.delete(key);renderList()}else select(row.dataset.path,row.dataset.kind);return}const fold=e.target.closest('[data-fold]');if(fold){collapsed.has(fold.dataset.fold)?collapsed.delete(fold.dataset.fold):collapsed.add(fold.dataset.fold);renderList();return}const all=e.target.closest('[data-all]');if(all){for(const f of visibleFiles(all.dataset.all)){const key=all.dataset.all+'|'+f.path;all.checked?checked.add(key):checked.delete(key)}renderList();return}const action=e.target.closest('[data-stage-group]');if(action){const source=action.dataset.stageGroup,visible=visibleFiles(source),chosen=visible.filter(f=>checked.has(source+'|'+f.path));stage((chosen.length?chosen:visible).map(f=>f.path),source);return}const item=e.target.closest('[data-secondary]');if(item){secondarySelected=Number(item.dataset.secondary);renderSecondary();renderSecondaryPreview()}});
    $('preview').addEventListener('click',e=>{if(e.target.closest('[data-clear-filter]')){clearSearch();return}const tab=e.target.closest('button[data-kind]');if(tab)select(selected,tab.dataset.kind);const hunk=e.target.closest('[data-hunk]');if(hunk)stage([selected],kind,Number(hunk.dataset.hunk));if(e.target.closest('#stage-file'))stage([selected],kind)});
    $('file-summary').addEventListener('click',e=>{if(e.target.closest('#commit-button'))openCommit();if(e.target.closest('#ai-commit'))openCommit(true)});
    $('search').addEventListener('input',()=>{renderList();if(view==='working')renderPreview()});
    $('clear-search').addEventListener('click',clearSearch);
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{switchView(button.dataset.view)}));
    document.querySelectorAll('[data-branch]').forEach(button=>button.addEventListener('click',()=>{const name=button.dataset.branch,isRemote=name.startsWith('origin/');openDialog(name,`<p>${name===branch?'当前工作区正在使用此分支。':isRemote?'这是最近一次 Fetch 获取的远端跟踪分支。':'浏览分支信息不会改变工作区。'}</p><div class="branch-info">HEAD    a83d9f1\n${isRemote?'更新于  2 分钟前':'upstream  origin/'+name}\n${name==='dev'?'ahead   2    behind  0':'ahead   0    behind  0'}</div>`,'<button class="tool" data-close>关闭</button>'+(!isRemote&&name!==branch?'<button class="tool" id="switch-branch" data-target="'+escape(name)+'">切换到此分支…</button>':''))}));
    $('overlay').addEventListener('click',e=>{if(e.target.closest('#continue-edit')){openCommit(false,true);return}if(e.target.closest('#discard-draft')){commitDraft='';closeDialog(true);return}if(e.target===$('overlay')||e.target.closest('.close,[data-close]'))closeDialog();if(e.target.closest('#switch-branch')){notify(files.some(f=>f.staged||f.unstaged)?'工作区有未提交变化，当前安全规则不允许切换分支':'演示稿仅展示切换入口');closeDialog()}if(e.target.closest('#confirm-commit')){if(!$('commit-message').value.trim()){$('commit-message').focus();notify('请填写提交说明');return}files.forEach(f=>{f.stagedHunks=[];syncFile(f)});checked.clear();commitDraft='';closeDialog(true);reconcile();notify('演示提交完成，未暂存变化仍保留')}});
    $('reset').addEventListener('click',()=>{init();notify('已恢复初始演示数据')});$('refresh').addEventListener('click',()=>notify('工作区已刷新（示例数据）'));$('back').addEventListener('click',()=>notify('正式接入后返回仓库列表，并保留筛选和滚动位置'));
    $('settings').addEventListener('click',()=>openDialog('仓库设置','<p>demo-workspace</p><div class="branch-info">Git 操作权限  Stage · Commit · Fetch · Pull · Push\n提交范围      仅已暂存内容\n远端行为      Pull 只允许快进，Push 永不 force</div>'));
    $('new-branch').addEventListener('click',()=>notify('首期复用现有新建分支入口，本稿演示分支信息与切换护栏'));$('project-menu').addEventListener('click',()=>openDialog('项目操作','<p>正式接入时复用现有的“打开目录”“打开终端”“打开编辑器”与“编辑配置”入口。</p>'));
    document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>notify(b.dataset.demo+' 演示：未访问远端，也未操作真实仓库')));
    $('collapse-groups').addEventListener('click',()=>{collapsed=collapsed.size?new Set():new Set(['staged','unstaged']);renderList()});
    function focusFile(entry){
      select(entry.path,entry.kind);
      const row=[...document.querySelectorAll('.file-row')].find(r=>r.dataset.path===entry.path&&r.dataset.kind===entry.kind);
      row?.querySelector('.file-open').focus({preventScroll:true});
      row?.scrollIntoView({block:'nearest'});
    }
    document.addEventListener('keydown',e=>{
      if(!$('overlay').hidden){
        if(e.key==='Escape'){e.preventDefault();closeDialog()}
        if(e.key==='Tab'){
          const controls=[...$('dialog').querySelectorAll('button:not(:disabled),textarea,input')];
          const first=controls[0],last=controls.at(-1);
          if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
          else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
        }
        return;
      }
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();return}
      if(e.target===$('search')&&e.key==='Escape'){e.preventDefault();clearSearch();return}
      if(view!=='working')return;
      const entries=['unstaged','staged'].flatMap(g=>collapsed.has(g)?[]:visibleFiles(g).map(f=>({path:f.path,kind:g})));
      if(e.target===$('search')&&e.key==='ArrowDown'&&entries.length){e.preventDefault();focusFile(entries[0]);return}
      if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight'].includes(e.key)){
        const file=files.find(f=>f.path===selected),next=kind==='staged'?'unstaged':'staged';
        if(file?.[next]){e.preventDefault();select(selected,next);document.querySelector('[role="tab"][aria-selected="true"]')?.focus()}
        return;
      }
      if(!e.target.closest('.file-open')||!['ArrowDown','ArrowUp'].includes(e.key)||!entries.length)return;
      const index=entries.findIndex(f=>f.path===selected&&f.kind===kind);
      const next=entries[Math.max(0,Math.min(entries.length-1,index+(e.key==='ArrowDown'?1:-1)))];
      e.preventDefault();focusFile(next);
    });
    const columnPreferences={};
    const columnSpecs=[['left-splitter','--left',170,310],['middle-splitter','--middle',260,490]];
    function updateColumnWidths(){
      const narrow=innerWidth<=1150;
      let left=columnPreferences['--left']??(narrow?180:220);
      let middle=columnPreferences['--middle']??(narrow?280:350);
      const budget=document.querySelector('.workspace').clientWidth-8-420;
      middle=Math.max(260,Math.min(middle,budget-left));
      left=Math.max(170,Math.min(left,budget-middle));
      document.documentElement.style.setProperty('--left',left+'px');
      document.documentElement.style.setProperty('--middle',middle+'px');
      for(const [id,property,min,max] of columnSpecs){
        const width=property==='--left'?left:middle,other=property==='--left'?middle:left;
        $(id).setAttribute('aria-valuemin',min);
        $(id).setAttribute('aria-valuemax',Math.min(max,budget-other));
        $(id).setAttribute('aria-valuenow',width);
      }
    }
    for(const [id,property,min,max] of columnSpecs){
      const handle=$(id);let startX,startWidth;
      const apply=width=>{
        const other=property==='--left'?'--middle':'--left';
        const limit=Math.min(max,document.querySelector('.workspace').clientWidth-parseFloat(getComputedStyle(document.documentElement).getPropertyValue(other))-8-420);
        columnPreferences[property]=Math.max(min,Math.min(limit,width));
        updateColumnWidths();
      };
      handle.addEventListener('pointerdown',e=>{startX=e.clientX;startWidth=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(property));handle.setPointerCapture(e.pointerId);handle.classList.add('dragging')});
      handle.addEventListener('pointermove',e=>{if(handle.hasPointerCapture(e.pointerId))apply(startWidth+e.clientX-startX)});
      handle.addEventListener('pointerup',e=>{if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);handle.classList.remove('dragging')});
      handle.addEventListener('pointercancel',()=>handle.classList.remove('dragging'));
      handle.addEventListener('lostpointercapture',()=>handle.classList.remove('dragging'));
      handle.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();apply(parseFloat(getComputedStyle(document.documentElement).getPropertyValue(property))+(e.key==='ArrowLeft'?-10:10))}});
    }
    window.addEventListener('resize',updateColumnWidths);
    updateColumnWidths();
    init();
  </script>
</body>
</html>
