<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Moo Fleet — handwritten f formation concept</title>
  <rect width="64" height="64" rx="14" fill="#171b22"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.5"/>
  <defs>
    <path id="fleet-route" d="M0 31 C8.5 34.2 16.5 30.9 19.1 22 C21.6 13.8 20.4 7.1 26 2.8 C28.8 0.7 32 1 34.2 3" fill="none"/>
  </defs>

  <!-- The flagship and escorts share one mother curve for consistent curvature. -->
  <use href="#fleet-route" transform="translate(12.5 15.5)" fill="none" stroke="#61afef" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#fleet-route" transform="translate(6.5 20) scale(.55)" fill="none" stroke="#56b6c2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <use href="#fleet-route" transform="translate(28.5 33) scale(.55)" fill="none" stroke="#c678dd" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
</svg>
