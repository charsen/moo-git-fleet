name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - 'desktop-validation/**'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    if: github.repository_owner == 'charsen'
    # 用 Intel 而不是 Apple Silicon：Windows 目标依赖 electron-builder 自动下载的
    # wine bundle，它在 x64 macOS 上原生运行；arm64 还要额外装 Rosetta。
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirm Intel runner
        shell: zsh {0}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]]

      - name: Install dependencies
        run: npm ci

      - name: Run source checks
        run: |
          npm run typecheck
          npm test -- --no-file-parallelism
          # 配色文档里的内嵌 token 块必须和 styles.css 一致，否则文档会继续
          # 展示一套已经不存在的配色。这一步只是读文件比对，几毫秒。
          npm run docs:palettes

      - name: Build Windows and Linux packages
        run: npm run build:desktop:all

      - name: Verify packaged layout
        shell: zsh {0}
        run: |
          set -euo pipefail
          work="${TMPDIR:-/tmp}/moo-fleet-desktop-build"
          for platform in linux win; do
            app="$work/output/${platform}-unpacked/resources/app"
            [[ -f "$app/main.cjs" ]] || { print -u2 "缺少 main.cjs：$platform"; exit 1; }
            [[ -f "$app/dist/server/index.cjs" ]] || { print -u2 "缺少服务端 bundle：$platform"; exit 1; }
            [[ -f "$app/dist/client/index.html" ]] || { print -u2 "缺少前端产物：$platform"; exit 1; }
          done
          print "两个平台的 resources/app 布局正确"

      - name: Verify artifact sizes fit each distribution channel
        shell: zsh {0}
        run: |
          set -euo pipefail
          # 2026-10-25 起分渠道：Linux 两件走 Gitee（100 MiB 单文件），Windows
          # 两件走 GitHub（2 GiB）。Windows 包自带 Chromium，0.1.46 实测离 100 MiB
          # 只剩 0.5–0.8 MiB，赌压缩率不如换渠道；这条断言防的是配置回退把
          # Linux 包涨回去，以及误把 Windows 包传上 Gitee。
          gitee=$((100 * 1024 * 1024))
          github=$((2 * 1024 * 1024 * 1024))
          found=0
          for artifact in release/desktop/*.AppImage(N) release/desktop/*.deb(N); do
            size=$(stat -f %z "$artifact")
            printf '%12s  %s\n' "$size" "$artifact:t"
            (( size < gitee )) || { print -u2 "超出 Gitee 100 MiB 上限：$artifact"; exit 1; }
            found=$((found + 1))
          done
          for artifact in release/desktop/*.exe(N); do
            size=$(stat -f %z "$artifact")
            printf '%12s  %s\n' "$size" "$artifact:t"
            (( size < github )) || { print -u2 "超出 GitHub 2 GiB 上限：$artifact"; exit 1; }
            found=$((found + 1))
          done
          (( found == 4 )) || { print -u2 "预期 4 个安装包，实际 $found"; exit 1; }

      # 上面两步只看目录布局和体积；这一步解包到底，验 desktop entry、
      # PE 架构、载荷内版本、asar 是否保持关闭。7-Zip 从 electron-builder
      # 自己的缓存里取，不需要额外装。
      - name: Verify package contents
        shell: zsh {0}
        run: npm run verify:desktop

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: moo-fleet-desktop-${{ github.sha }}
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.exe
          if-no-files-found: error
          retention-days: 7
